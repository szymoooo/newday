<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFBF7">
<title>Mój Dzień</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="view"></main>

<nav id="nav" aria-label="Menu główne">
  <button data-act="tab" data-v="start" data-t="start"><span class="ni" data-i="home"></span>Start</button>
  <button data-act="tab" data-v="links" data-t="links"><span class="ni" data-i="link"></span>Linki</button>
  <button data-act="tab" data-v="recipes" data-t="recipes"><span class="ni" data-i="cook"></span>Przepisy</button>
  <button data-act="tab" data-v="shopping" data-t="shopping"><span class="ni" data-i="cart"></span>Zakupy</button>
  <button data-act="tab" data-v="more" data-t="more"><span class="ni" data-i="grid"></span>Więcej</button>
</nav>

<button id="fab" data-act="add" aria-label="Dodaj"><span class="ni" data-i="plus" data-s="30"></span></button>

<div id="sheet" class="sheet hidden"><div id="panel" class="panel"></div></div>
<div id="busy" class="busy hidden"><div class="spin"></div><div id="busyText">Chwila…</div></div>
<div id="toast" class="toast hidden"></div>
<input type="file" id="filePick" accept="image/*" hidden>
<input type="file" id="fileCam" accept="image/*" capture="environment" hidden>

<script src="app.js"></script>
</body>
</html>
